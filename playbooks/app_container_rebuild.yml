---
# Demo 4c: App Dependency Remediation — Container Image Rebuild
#
# For container-based deployments: rebuild the container image with the
# Lightwell-fixed library, push to registry, perform rolling update.
#
# Flow:
#   Lightwell publishes fix
#     → Controller triggers image rebuild with LW dependency
#     → Push to Quay/registry
#     → Rolling update on target hosts (or OpenShift/K8s)
#     → Validate service health
#
# Triggered by: EDA (app_dependency_fix event with deployment_type=container)
# or called as part of the CI/CD workflow

- name: "App Container Rebuild — Build Image with Lightwell Fix"
  hosts: builders
  become: true
  gather_facts: true
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    image_registry: "{{ demo_app_image_registry }}"
    image_tag: "{{ demo_app_fixed_version }}-{{ cve_id | lower | replace('-', '') }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"
    base_image: "registry.access.redhat.com/ubi9/python-311:latest"

  tasks:
    - name: "Phase 1 — Prepare build context with fixed dependency"
      block:
        - name: Create build workspace
          ansible.builtin.file:
            path: "/tmp/app-container-rebuild/{{ app_name }}"
            state: directory
            mode: "0750"

        - name: Clone application source
          ansible.builtin.git:
            repo: "{{ demo_app_repo }}"
            dest: "/tmp/app-container-rebuild/{{ app_name }}/src"
            version: "{{ demo_app_target_branch | default('main') }}"
            force: true

        - name: Update dependency in requirements.txt
          ansible.builtin.lineinfile:
            path: "/tmp/app-container-rebuild/{{ app_name }}/src/{{ demo_app_dependency_file }}"
            regexp: "^{{ affected_library }}[=<>~!]"
            line: "{{ affected_library }}=={{ fixed_version }}"

        - name: Generate Containerfile with Lightwell index
          ansible.builtin.copy:
            content: |
              FROM {{ base_image }}

              LABEL com.redhat.security.cve-fix="{{ cve_id }}"
              LABEL com.redhat.security.fixed-library="{{ affected_library }}=={{ fixed_version }}"
              LABEL com.redhat.security.source="Project Lightwell"

              WORKDIR /opt/app-root/src
              COPY src/ .

              RUN pip install --no-cache-dir \
                  --extra-index-url {{ lightwell_index_url }} \
                  -r {{ demo_app_dependency_file }}

              EXPOSE {{ demo_app_port }}
              CMD ["python", "app.py"]
            dest: "/tmp/app-container-rebuild/{{ app_name }}/Containerfile"
            mode: "0644"

    - name: "Phase 2 — Build and scan container image"
      block:
        - name: Build container image with Lightwell-fixed dependency
          containers.podman.podman_image:
            name: "{{ image_registry }}:{{ image_tag }}"
            path: "/tmp/app-container-rebuild/{{ app_name }}"
            file: Containerfile
            force: true
          register: build_result

        - name: Verify fixed library version in built image
          containers.podman.podman_container:
            name: "{{ app_name }}-dep-check"
            image: "{{ image_registry }}:{{ image_tag }}"
            command: "pip show {{ affected_library }}"
            detach: false
            rm: true
          register: dep_check

        - name: Assert library at fixed version
          ansible.builtin.assert:
            that:
              - "fixed_version in dep_check.stdout"
            fail_msg: "Built image does NOT contain {{ affected_library }}=={{ fixed_version }}"
            success_msg: "Confirmed: image contains {{ affected_library }}=={{ fixed_version }}"

        - name: Run Grype vulnerability scan on rebuilt image
          ansible.builtin.command:
            cmd: "grype {{ image_registry }}:{{ image_tag }} --output json"
          register: grype_scan
          changed_when: false
          failed_when: false

        - name: Verify CVE absent from rebuilt image
          ansible.builtin.assert:
            that:
              - "cve_id not in grype_scan.stdout"
            fail_msg: "{{ cve_id }} still present in rebuilt image — investigate build"
            success_msg: "{{ cve_id }} NOT found in rebuilt image — fix confirmed"

    - name: "Phase 3 — Push to container registry"
      block:
        - name: Tag image as latest
          containers.podman.podman_tag:
            image: "{{ image_registry }}:{{ image_tag }}"
            target_names:
              - "{{ image_registry }}:latest"
              - "{{ image_registry }}:{{ cve_id | lower }}-fix"

        - name: Push image to registry
          containers.podman.podman_image:
            name: "{{ image_registry }}:{{ image_tag }}"
            push: true
            push_args:
              dest: "{{ image_registry }}"
          register: push_result

        - name: Push latest tag
          containers.podman.podman_image:
            name: "{{ image_registry }}:latest"
            push: true
            push_args:
              dest: "{{ image_registry }}"

        - name: Display build summary
          ansible.builtin.debug:
            msg: |
              === CONTAINER BUILD COMPLETE ===
              Image: {{ image_registry }}:{{ image_tag }}
              Also tagged: :latest, :{{ cve_id | lower }}-fix
              CVE scan: CLEAN
              Ready for rolling deployment.
              ================================

- name: "App Container Rebuild — Rolling Update on Targets"
  hosts: targets
  become: true
  gather_facts: true
  serial: 1
  vars:
    app_name: "{{ demo_app_name }}"
    cve_id: "{{ demo_app_cve_id }}"
    image_registry: "{{ demo_app_image_registry }}"
    image_tag: "{{ demo_app_fixed_version }}-{{ demo_app_cve_id | lower | replace('-', '') }}"

  tasks:
    - name: "Phase 4 — Rolling deployment"
      block:
        - name: Pre-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: pre_health
          failed_when: false

        - name: Pull rebuilt image
          containers.podman.podman_image:
            name: "{{ image_registry }}:{{ image_tag }}"
            pull: true
            force: true

        - name: Stop current container
          containers.podman.podman_container:
            name: "{{ app_name }}"
            state: stopped
          failed_when: false

        - name: Deploy rebuilt container
          containers.podman.podman_container:
            name: "{{ app_name }}"
            image: "{{ image_registry }}:{{ image_tag }}"
            state: started
            restart_policy: always
            ports:
              - "{{ demo_app_port }}:{{ demo_app_port }}"
            env:
              CVE_FIX_APPLIED: "{{ cve_id }}"
              LIGHTWELL_FIX: "{{ demo_app_affected_library }}=={{ demo_app_fixed_version }}"
            label:
              security.cve-fix: "{{ cve_id }}"
          register: deploy_result

        - name: Wait for application startup
          ansible.builtin.wait_for:
            port: "{{ demo_app_port }}"
            timeout: 60

        - name: Post-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: post_health
          retries: 5
          delay: 5

        - name: Assert service healthy after rolling update
          ansible.builtin.assert:
            that:
              - post_health.status == 200
            fail_msg: "Service NOT healthy after deploy on {{ inventory_hostname }} — rollback may be needed"
            success_msg: "Service healthy on {{ inventory_hostname }}"

    - name: Build container deployment report
      ansible.builtin.set_fact:
        container_deploy_report:
          host: "{{ inventory_hostname }}"
          app_name: "{{ app_name }}"
          cve_id: "{{ cve_id }}"
          remediation_type: "container_image_rebuild"
          image_deployed: "{{ image_registry }}:{{ image_tag }}"
          library_fixed: "{{ demo_app_affected_library }}=={{ demo_app_fixed_version }}"
          service_healthy: true
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Display rolling update summary
      ansible.builtin.debug:
        msg: |
          === CONTAINER ROLLING UPDATE ===
          Host: {{ container_deploy_report.host }}
          App: {{ container_deploy_report.app_name }}
          CVE: {{ container_deploy_report.cve_id }}
          Image: {{ container_deploy_report.image_deployed }}
          Library: {{ container_deploy_report.library_fixed }}
          Healthy: {{ container_deploy_report.service_healthy }}
          =================================
          FLOW: Lightwell fix → rebuild image → push registry →
                rolling update per host → health validated
          =================================
