---
# Demo 4c: App Dependency Remediation — Container Image Rebuild (Gitea)
#
# Rebuild the container image with the Lightwell-fixed library,
# push to registry, rolling update on target hosts.
#
# Flow:
#   Lightwell publishes fix to internal PyPI
#     → Controller clones app from Gitea, updates dependency
#     → Build container image with Lightwell-fixed dependency
#     → Scan image with Grype
#     → Push to Gitea container registry (or local)
#     → Rolling update on targets
#     → Health check per host

- name: "App Container Rebuild — Build Image with Lightwell Fix"
  hosts: builders
  become: true
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    image_registry: "{{ demo_app_image_registry }}"
    image_tag: "{{ demo_app_fixed_version }}-{{ cve_id | lower | replace('-', '') }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"
    base_image: "registry.access.redhat.com/ubi9/python-311:latest"
    gitea_url: "{{ demo_gitea_url }}"
    gitea_owner: "{{ demo_gitea_owner }}"

  tasks:
    - name: "Phase 1 — Prepare build context"
      block:
        - name: Create build workspace
          ansible.builtin.file:
            path: "/tmp/app-container-rebuild/{{ app_name }}"
            state: directory
            mode: "0750"

        - name: Clone from Gitea
          ansible.builtin.git:
            repo: "{{ gitea_url }}/{{ gitea_owner }}/{{ app_name }}.git"
            dest: "/tmp/app-container-rebuild/{{ app_name }}/src"
            version: "{{ demo_app_target_branch | default('main') }}"
            force: true

        - name: Update dependency version pin
          ansible.builtin.lineinfile:
            path: "/tmp/app-container-rebuild/{{ app_name }}/src/{{ demo_app_dependency_file }}"
            regexp: "^{{ affected_library }}[=<>~!]"
            line: "{{ affected_library }}=={{ fixed_version }}"

        - name: Generate Containerfile with Lightwell index
          ansible.builtin.copy:
            content: |
              FROM {{ base_image }}

              LABEL com.redhat.security.cve-fix="{{ cve_id }}"
              LABEL com.redhat.security.fixed-library="{{ affected_library }}=={{ fixed_version }}"
              LABEL com.redhat.security.source="Project Lightwell"

              WORKDIR /opt/app-root/src
              COPY src/ .

              RUN pip install --no-cache-dir \
                  --extra-index-url {{ lightwell_index_url }} \
                  -r {{ demo_app_dependency_file }}

              EXPOSE 8080
              CMD ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "app:app"]
            dest: "/tmp/app-container-rebuild/{{ app_name }}/Containerfile"
            mode: "0644"

    - name: "Phase 2 — Build and scan"
      block:
        - name: Build container image
          containers.podman.podman_image:
            name: "{{ image_registry }}:{{ image_tag }}"
            path: "/tmp/app-container-rebuild/{{ app_name }}"
            file: Containerfile
            force: true
          register: build_result

        - name: Verify fixed library in built image
          containers.podman.podman_container:
            name: "{{ app_name }}-dep-check"
            image: "{{ image_registry }}:{{ image_tag }}"
            command: "pip show {{ affected_library }}"
            detach: false
            rm: true
          register: dep_check

        - name: Assert library at fixed version
          ansible.builtin.assert:
            that:
              - "fixed_version in dep_check.stdout"
            fail_msg: "Built image does NOT contain {{ affected_library }}=={{ fixed_version }}"
            success_msg: "Confirmed: image contains {{ affected_library }}=={{ fixed_version }}"

        - name: Run Grype vulnerability scan
          ansible.builtin.command:
            cmd: "grype {{ image_registry }}:{{ image_tag }} --output json"
          register: grype_scan
          changed_when: false
          failed_when: false

        - name: Verify CVE absent
          ansible.builtin.assert:
            that:
              - "cve_id not in grype_scan.stdout"
            fail_msg: "{{ cve_id }} still present in rebuilt image"
            success_msg: "{{ cve_id }} NOT found — fix confirmed"

    - name: "Phase 3 — Tag and export image"
      block:
        - name: Tag image as latest
          containers.podman.podman_tag:
            image: "{{ image_registry }}:{{ image_tag }}"
            target_names:
              - "{{ image_registry }}:latest"

        - name: Save image to tar for distribution to targets
          ansible.builtin.command:
            cmd: >-
              podman save -o /tmp/{{ app_name }}-{{ image_tag }}.tar
              {{ image_registry }}:{{ image_tag }}
          changed_when: true

        - name: Display build summary
          ansible.builtin.debug:
            msg: |
              === CONTAINER BUILD COMPLETE ===
              Image: {{ image_registry }}:{{ image_tag }}
              CVE scan: CLEAN
              Saved: /tmp/{{ app_name }}-{{ image_tag }}.tar
              ================================

- name: "App Container Rebuild — Rolling Update on Targets"
  hosts: targets
  become: true
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  serial: 1
  vars:
    app_name: "{{ demo_app_name }}"
    cve_id: "{{ demo_app_cve_id }}"
    image_registry: "{{ demo_app_image_registry }}"
    image_tag: "{{ demo_app_fixed_version }}-{{ demo_app_cve_id | lower | replace('-', '') }}"

  tasks:
    - name: "Phase 4 — Rolling deployment"
      block:
        - name: Copy image tar from builder
          ansible.builtin.copy:
            src: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            dest: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            mode: "0644"
          delegate_to: node2

        - name: Fetch image tar to controller
          ansible.builtin.fetch:
            src: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            dest: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            flat: true
          delegate_to: node2
          run_once: true

        - name: Copy image tar to target
          ansible.builtin.copy:
            src: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            dest: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            mode: "0644"

        - name: Load image on target
          ansible.builtin.command:
            cmd: "podman load -i /tmp/{{ app_name }}-{{ image_tag }}.tar"
          changed_when: true

        - name: Stop current container
          containers.podman.podman_container:
            name: "{{ app_name }}"
            state: stopped
          failed_when: false

        - name: Deploy rebuilt container
          containers.podman.podman_container:
            name: "{{ app_name }}"
            image: "{{ image_registry }}:{{ image_tag }}"
            state: started
            restart_policy: always
            ports:
              - "{{ demo_app_port }}:8080"
            env:
              CVE_FIX_APPLIED: "{{ cve_id }}"
              LIGHTWELL_FIX: "{{ demo_app_affected_library }}=={{ demo_app_fixed_version }}"
            label:
              security.cve-fix: "{{ cve_id }}"
          register: deploy_result

        - name: Wait for startup
          ansible.builtin.wait_for:
            port: "{{ demo_app_port }}"
            timeout: 60

        - name: Post-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: post_health
          retries: 5
          delay: 5

        - name: Clean up image tar
          ansible.builtin.file:
            path: "/tmp/{{ app_name }}-{{ image_tag }}.tar"
            state: absent

    - name: Display rolling update summary
      ansible.builtin.debug:
        msg: |
          === CONTAINER ROLLING UPDATE ===
          Host: {{ inventory_hostname }}
          App: {{ app_name }}
          CVE: {{ cve_id }}
          Image: {{ image_registry }}:{{ image_tag }}
          Library: {{ demo_app_affected_library }}=={{ demo_app_fixed_version }}
          Healthy: {{ post_health.status == 200 }}
          =================================
          FLOW: Lightwell fix → rebuild image → scan →
                distribute → rolling update → health validated
          =================================
