---
# Demo 4a: App Dependency Remediation — CI/CD Direct Path
#
# Lightwell publishes a fixed library version. This playbook orchestrates
# the full rebuild pipeline: update dependency spec → trigger CI/CD build →
# wait for artifact → deploy rebuilt application → validate health.
#
# KEY DISTINCTION: App dependencies are a BUILD-TIME fix, not deploy-time.
# Unlike OS packages (dnf update on live system), application libraries are
# baked into the application. Remediation goes through CI/CD, not package manager.
#
# Triggered by: EDA (app_dependency_fix event)

- name: "App Dependency Fix — CI/CD Rebuild Pipeline"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    app_repo: "{{ demo_app_repo }}"
    dependency_file: "{{ demo_app_dependency_file }}"
    ci_pipeline_url: "{{ demo_ci_pipeline_url }}"
    ci_api_token: "{{ vault_ci_api_token }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"

  tasks:
    - name: "Phase 1 — Update dependency specification"
      block:
        - name: Clone application repository
          ansible.builtin.git:
            repo: "{{ app_repo }}"
            dest: "/tmp/app-rebuild/{{ app_name }}"
            version: "{{ demo_app_target_branch | default('main') }}"
            force: true

        - name: Read current dependency file
          ansible.builtin.slurp:
            src: "/tmp/app-rebuild/{{ app_name }}/{{ dependency_file }}"
          register: dep_file_content

        - name: Update dependency version pin to Lightwell fix
          ansible.builtin.lineinfile:
            path: "/tmp/app-rebuild/{{ app_name }}/{{ dependency_file }}"
            regexp: "^{{ affected_library }}[=<>~!]"
            line: "{{ affected_library }}=={{ fixed_version }}"
          register: dep_update

        - name: Commit dependency update
          ansible.builtin.shell:
            cmd: |
              git config user.email "aap-security@nostromo.io"
              git config user.name "AAP Security Automation"
              git add {{ dependency_file }}
              git commit -m "fix(security): update {{ affected_library }} to {{ fixed_version }}

              Resolves {{ cve_id }} via Lightwell-published fix.
              Source: {{ lightwell_index_url }}"
              git push origin {{ demo_app_target_branch | default('main') }}
            chdir: "/tmp/app-rebuild/{{ app_name }}"
          when: dep_update.changed

    - name: "Phase 2 — Trigger CI/CD pipeline rebuild"
      block:
        - name: Trigger pipeline via CI API
          ansible.builtin.uri:
            url: "{{ ci_pipeline_url }}/api/v4/projects/{{ demo_ci_project_id }}/pipeline"
            method: POST
            headers:
              PRIVATE-TOKEN: "{{ ci_api_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              ref: "{{ demo_app_target_branch | default('main') }}"
              variables:
                - key: "SECURITY_FIX"
                  value: "{{ cve_id }}"
                - key: "LIGHTWELL_INDEX"
                  value: "{{ lightwell_index_url }}"
            status_code: [200, 201]
          register: pipeline_trigger

        - name: Record pipeline ID
          ansible.builtin.set_fact:
            pipeline_id: "{{ pipeline_trigger.json.id }}"
            pipeline_web_url: "{{ pipeline_trigger.json.web_url }}"

        - name: Display pipeline status
          ansible.builtin.debug:
            msg: "Pipeline triggered: {{ pipeline_web_url }}"

    - name: "Phase 3 — Wait for build artifact"
      block:
        - name: Poll pipeline status until complete
          ansible.builtin.uri:
            url: "{{ ci_pipeline_url }}/api/v4/projects/{{ demo_ci_project_id }}/pipelines/{{ pipeline_id }}"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ ci_api_token }}"
            status_code: [200]
          register: pipeline_status
          until: pipeline_status.json.status in ['success', 'failed', 'canceled']
          retries: 30
          delay: 20

        - name: Assert pipeline succeeded
          ansible.builtin.assert:
            that:
              - pipeline_status.json.status == 'success'
            fail_msg: "CI/CD pipeline FAILED ({{ pipeline_status.json.status }}) — manual investigation required"
            success_msg: "Pipeline completed successfully — artifact ready"

        - name: Retrieve build artifact metadata
          ansible.builtin.uri:
            url: "{{ ci_pipeline_url }}/api/v4/projects/{{ demo_ci_project_id }}/pipelines/{{ pipeline_id }}/jobs"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ ci_api_token }}"
            status_code: [200]
          register: pipeline_jobs

        - name: Extract container image tag from build job
          ansible.builtin.set_fact:
            rebuilt_image_tag: "{{ demo_app_image_registry }}:{{ pipeline_id }}-{{ cve_id | lower }}"

- name: "App Dependency Fix — Deploy Rebuilt Application"
  hosts: targets
  become: true
  gather_facts: true
  vars:
    app_name: "{{ demo_app_name }}"
    cve_id: "{{ demo_app_cve_id }}"

  tasks:
    - name: "Phase 4 — Deploy rebuilt application"
      block:
        - name: Pre-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: pre_deploy_health
          failed_when: false

        - name: Pull rebuilt container image
          containers.podman.podman_image:
            name: "{{ hostvars['localhost']['rebuilt_image_tag'] }}"
            pull: true
            force: true

        - name: Stop current application container
          containers.podman.podman_container:
            name: "{{ app_name }}"
            state: stopped
          failed_when: false

        - name: Start application with rebuilt image
          containers.podman.podman_container:
            name: "{{ app_name }}"
            image: "{{ hostvars['localhost']['rebuilt_image_tag'] }}"
            state: started
            restart_policy: always
            ports:
              - "{{ demo_app_port }}:{{ demo_app_port }}"
            env:
              CVE_FIX_APPLIED: "{{ cve_id }}"
          register: deploy_result

    - name: "Phase 5 — Post-deploy validation"
      block:
        - name: Wait for application startup
          ansible.builtin.wait_for:
            port: "{{ demo_app_port }}"
            timeout: 60

        - name: Post-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: post_deploy_health
          retries: 5
          delay: 5

        - name: Verify fixed library version in running container
          containers.podman.podman_container:
            name: "{{ app_name }}-version-check"
            image: "{{ hostvars['localhost']['rebuilt_image_tag'] }}"
            command: "pip show {{ demo_app_affected_library }} | grep Version"
            detach: false
            rm: true
          register: lib_version_check

        - name: Assert library is at fixed version
          ansible.builtin.assert:
            that:
              - "demo_app_fixed_version in lib_version_check.stdout"
            fail_msg: "Library {{ demo_app_affected_library }} NOT at expected version {{ demo_app_fixed_version }}"
            success_msg: "Confirmed: {{ demo_app_affected_library }} {{ demo_app_fixed_version }} running in production"

        - name: Build deployment report
          ansible.builtin.set_fact:
            app_deploy_report:
              host: "{{ inventory_hostname }}"
              app_name: "{{ app_name }}"
              cve_id: "{{ cve_id }}"
              remediation_type: "app_dependency_rebuild"
              pipeline_id: "{{ hostvars['localhost']['pipeline_id'] }}"
              image_deployed: "{{ hostvars['localhost']['rebuilt_image_tag'] }}"
              library_fixed: "{{ demo_app_affected_library }}=={{ demo_app_fixed_version }}"
              service_healthy: true
              timestamp: "{{ ansible_date_time.iso8601 }}"

        - name: Display deployment summary
          ansible.builtin.debug:
            msg: |
              === APP DEPENDENCY REMEDIATION REPORT ===
              Host: {{ app_deploy_report.host }}
              App: {{ app_deploy_report.app_name }}
              CVE: {{ app_deploy_report.cve_id }}
              Type: {{ app_deploy_report.remediation_type }}
              Image: {{ app_deploy_report.image_deployed }}
              Library: {{ app_deploy_report.library_fixed }}
              Healthy: {{ app_deploy_report.service_healthy }}
              Pipeline: {{ app_deploy_report.pipeline_id }}
              ==========================================
              NOTE: This was a BUILD-TIME fix via CI/CD.
              The library is baked into the application image.
              No host-level package manager was involved.
              ==========================================
