---
# Demo 3, Phase 1: Container Test — Validate fix in isolation
#
# Builds a test container mirroring production packages, applies the
# patched RPM, and verifies the CVE is resolved without regressions.
#
# Triggered by: EDA workflow (rhsa_available event)
# Runs on: Node 2 (builder with podman)

- name: "Container Test — Validate Patch in Isolation"
  hosts: builders
  become: true
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_cve_id }}"
    advisory_id: "{{ demo_advisory_id }}"
    fixed_package: "{{ demo_cve_package }}"
    fixed_version: "{{ demo_cve_fixed_version }}"
    test_container_name: "patch-test-{{ cve_id | lower | replace('-', '_') }}"
    base_image: "registry.access.redhat.com/ubi9/ubi:latest"

  tasks:
    - name: Create Containerfile for test
      ansible.builtin.copy:
        content: |
          FROM {{ base_image }}
          RUN dnf install -y python3-cryptography-{{ demo_cve_vulnerable_version }} && \
              dnf clean all
          CMD ["python3", "-c", "import cryptography; print(cryptography.__version__)"]
        dest: "/tmp/Containerfile.patch-test"
        mode: "0644"

    - name: Build test container with vulnerable package
      containers.podman.podman_image:
        name: "{{ test_container_name }}-base"
        path: /tmp
        file: Containerfile.patch-test
        force: true

    - name: Run pre-patch verification (confirm vulnerable version present)
      containers.podman.podman_container:
        name: "{{ test_container_name }}-precheck"
        image: "{{ test_container_name }}-base"
        command: >-
          rpm -q python3-cryptography
        detach: false
        rm: true
      register: precheck_result

    - name: Display pre-patch state
      ansible.builtin.debug:
        msg: "Pre-patch: {{ precheck_result.stdout | default('container ran') }}"

    - name: Create patched Containerfile
      ansible.builtin.copy:
        content: |
          FROM {{ test_container_name }}-base
          RUN dnf update-minimal --advisory {{ advisory_id }} -y && \
              dnf clean all
          CMD ["python3", "-c", "import cryptography; print(cryptography.__version__)"]
        dest: "/tmp/Containerfile.patch-apply"
        mode: "0644"

    - name: Build patched test container
      containers.podman.podman_image:
        name: "{{ test_container_name }}-patched"
        path: /tmp
        file: Containerfile.patch-apply
        force: true

    - name: Run post-patch verification (confirm fix applied)
      containers.podman.podman_container:
        name: "{{ test_container_name }}-postcheck"
        image: "{{ test_container_name }}-patched"
        command: >-
          rpm -q python3-cryptography
        detach: false
        rm: true
      register: postcheck_result

    - name: Display post-patch state
      ansible.builtin.debug:
        msg: "Post-patch: {{ postcheck_result.stdout | default('container ran') }}"

    - name: Run application smoke test in patched container
      containers.podman.podman_container:
        name: "{{ test_container_name }}-smoketest"
        image: "{{ test_container_name }}-patched"
        command: >-
          python3 -c "
          from cryptography.fernet import Fernet;
          key = Fernet.generate_key();
          f = Fernet(key);
          token = f.encrypt(b'test payload');
          assert f.decrypt(token) == b'test payload';
          print('SMOKE TEST PASSED: encrypt/decrypt OK')
          "
        detach: false
        rm: true
      register: smoketest_result

    - name: Assert smoke test passed
      ansible.builtin.assert:
        that:
          - "'SMOKE TEST PASSED' in smoketest_result.stdout"
        fail_msg: "Smoke test FAILED — patch may introduce regressions"
        success_msg: "Smoke test PASSED — patch is safe to deploy"

    - name: Run Grype scan on patched container to confirm CVE absent
      ansible.builtin.command:
        cmd: >-
          grype {{ test_container_name }}-patched
          --output json --fail-on critical
      register: grype_scan
      changed_when: false
      failed_when: false

    - name: Check CVE is no longer reported
      ansible.builtin.set_fact:
        cve_still_present: "{{ cve_id in (grype_scan.stdout | default('')) }}"

    - name: Assert CVE resolved in container
      ansible.builtin.assert:
        that:
          - not cve_still_present
        fail_msg: "{{ cve_id }} still present after patching — investigate"
        success_msg: "{{ cve_id }} RESOLVED in test container"

    - name: Build container test report
      ansible.builtin.set_fact:
        container_test_report:
          cve_id: "{{ cve_id }}"
          advisory_id: "{{ advisory_id }}"
          test_result: "PASS"
          pre_patch_version: "{{ precheck_result.stdout | default('unknown') }}"
          post_patch_version: "{{ postcheck_result.stdout | default('unknown') }}"
          smoke_test: "PASSED"
          vulnerability_scan: "{{ cve_id }} not found (resolved)"
          safe_to_deploy: true
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Display container test summary
      ansible.builtin.debug:
        msg: |
          === CONTAINER TEST REPORT ===
          CVE: {{ container_test_report.cve_id }}
          Advisory: {{ container_test_report.advisory_id }}
          Result: {{ container_test_report.test_result }}
          Smoke test: {{ container_test_report.smoke_test }}
          Vulnerability scan: {{ container_test_report.vulnerability_scan }}
          Safe to deploy to VMs: {{ container_test_report.safe_to_deploy }}
          =============================

    - name: Cleanup test images
      containers.podman.podman_image:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ test_container_name }}-base"
        - "{{ test_container_name }}-patched"
