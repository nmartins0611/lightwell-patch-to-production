---
# Demo 4b: App Dependency Remediation — GitOps Path
#
# Lightwell publishes a fixed library version. Instead of pushing directly,
# this workflow opens a Pull Request updating the dependency version.
# CI runs automatically, builds, tests. Merge triggers CD deployment.
# Ansible validates post-deploy health.
#
# Flow:
#   Lightwell publishes fix to repo
#     → Controller opens PR updating dependency version
#     → CI runs, builds, tests (automated)
#     → Merge → CD deploys automatically
#     → Ansible validates post-deploy health
#
# Triggered by: EDA (app_dependency_fix_gitops event)

- name: "App Dependency Fix — GitOps PR Workflow"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"
    app_name: "{{ demo_app_name }}"
    app_repo: "{{ demo_app_repo }}"
    dependency_file: "{{ demo_app_dependency_file }}"
    target_branch: "{{ demo_app_target_branch | default('main') }}"
    lightwell_index_url: "{{ demo_lightwell_pypi_url }}"
    gitops_api_url: "{{ demo_gitops_api_url }}"
    gitops_api_token: "{{ vault_gitops_api_token }}"

  tasks:
    - name: "Phase 1 — Create fix branch and update dependency"
      block:
        - name: Clone application repository
          ansible.builtin.git:
            repo: "{{ app_repo }}"
            dest: "/tmp/app-gitops/{{ app_name }}"
            version: "{{ target_branch }}"
            force: true

        - name: Create security fix branch
          ansible.builtin.shell:
            cmd: |
              git checkout -b security/{{ cve_id | lower }}
            chdir: "/tmp/app-gitops/{{ app_name }}"
          register: branch_create

        - name: Set fix branch name
          ansible.builtin.set_fact:
            fix_branch: "security/{{ cve_id | lower }}"

        - name: Update dependency version pin to Lightwell fix
          ansible.builtin.lineinfile:
            path: "/tmp/app-gitops/{{ app_name }}/{{ dependency_file }}"
            regexp: "^{{ affected_library }}[=<>~!]"
            line: "{{ affected_library }}=={{ fixed_version }}"
          register: dep_update

        - name: Commit and push fix branch
          ansible.builtin.shell:
            cmd: |
              git config user.email "aap-security@nostromo.io"
              git config user.name "AAP Security Automation"
              git add {{ dependency_file }}
              git commit -m "fix(security): update {{ affected_library }} to {{ fixed_version }}

              Resolves {{ cve_id }} — Lightwell-published fix.
              Source: {{ lightwell_index_url }}

              This is an automated security remediation. The vulnerable library
              is an application dependency that requires a rebuild to remediate.
              Unlike OS-level packages, this cannot be fixed with dnf/yum update."
              git push origin {{ fix_branch }}
            chdir: "/tmp/app-gitops/{{ app_name }}"
          when: dep_update.changed

    - name: "Phase 2 — Open Pull Request"
      block:
        - name: Create merge request via GitLab API
          ansible.builtin.uri:
            url: "{{ gitops_api_url }}/api/v4/projects/{{ demo_ci_project_id }}/merge_requests"
            method: POST
            headers:
              PRIVATE-TOKEN: "{{ gitops_api_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              source_branch: "{{ fix_branch }}"
              target_branch: "{{ target_branch }}"
              title: "fix(security): {{ cve_id }} — Update {{ affected_library }} to {{ fixed_version }}"
              description: |
                ## Security Remediation (Automated)

                **CVE:** {{ cve_id }}
                **Library:** {{ affected_library }}
                **Fixed Version:** {{ fixed_version }}
                **Source:** Project Lightwell

                ### What changed
                Updated `{{ dependency_file }}` to pin `{{ affected_library }}` at version `{{ fixed_version }}`.

                ### Why this is a rebuild, not a patch
                Application dependencies are **build-time artifacts**. Unlike OS packages
                where `dnf update` patches a live system, this library is compiled into
                the application. The fix requires:
                1. Version pin update (this PR)
                2. CI/CD rebuild of the application
                3. Redeployment of the rebuilt artifact

                ### Verification
                - [ ] CI pipeline passes (build + unit tests)
                - [ ] Container vulnerability scan shows CVE absent
                - [ ] Integration tests pass
                - [ ] Post-deploy health check green

                ---
                _Opened by AAP Security Automation via Event-Driven Ansible_
              labels: "security,automated,lightwell"
              remove_source_branch: true
            status_code: [200, 201]
          register: mr_result

        - name: Record merge request details
          ansible.builtin.set_fact:
            merge_request_id: "{{ mr_result.json.iid }}"
            merge_request_url: "{{ mr_result.json.web_url }}"

        - name: Display PR status
          ansible.builtin.debug:
            msg: |
              === GITOPS PR OPENED ===
              MR: {{ merge_request_url }}
              Branch: {{ fix_branch }} → {{ target_branch }}
              Title: fix(security): {{ cve_id }} — Update {{ affected_library }} to {{ fixed_version }}
              ========================
              Next: CI will build, test, and scan automatically.
              On merge, CD will deploy the rebuilt application.

    - name: "Phase 3 — Wait for CI pipeline on the MR"
      block:
        - name: Poll MR pipeline status
          ansible.builtin.uri:
            url: "{{ gitops_api_url }}/api/v4/projects/{{ demo_ci_project_id }}/merge_requests/{{ merge_request_id }}/pipelines"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ gitops_api_token }}"
            status_code: [200]
          register: mr_pipelines
          until: >-
            mr_pipelines.json | length > 0 and
            mr_pipelines.json[0].status in ['success', 'failed', 'canceled']
          retries: 30
          delay: 20

        - name: Assert MR pipeline passed
          ansible.builtin.assert:
            that:
              - mr_pipelines.json[0].status == 'success'
            fail_msg: "MR pipeline FAILED — manual review required at {{ merge_request_url }}"
            success_msg: "MR pipeline passed — safe to merge"

    - name: "Phase 4 — Auto-merge (if configured) or report ready"
      block:
        - name: Merge the MR (auto-merge enabled)
          ansible.builtin.uri:
            url: "{{ gitops_api_url }}/api/v4/projects/{{ demo_ci_project_id }}/merge_requests/{{ merge_request_id }}/merge"
            method: PUT
            headers:
              PRIVATE-TOKEN: "{{ gitops_api_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              merge_when_pipeline_succeeds: false
              should_remove_source_branch: true
              squash: true
              squash_commit_message: "fix(security): {{ cve_id }} — {{ affected_library }}=={{ fixed_version }} [Lightwell]"
            status_code: [200]
          register: merge_result
          when: demo_gitops_auto_merge | default(true)

        - name: Display merge status
          ansible.builtin.debug:
            msg: |
              === GITOPS MERGE COMPLETE ===
              MR {{ merge_request_id }} merged to {{ target_branch }}.
              CD pipeline will now deploy the rebuilt application.
              =============================

- name: "App Dependency Fix — GitOps Post-Deploy Validation"
  hosts: targets
  become: true
  gather_facts: true
  vars:
    app_name: "{{ demo_app_name }}"
    cve_id: "{{ demo_app_cve_id }}"
    affected_library: "{{ demo_app_affected_library }}"
    fixed_version: "{{ demo_app_fixed_version }}"

  tasks:
    - name: "Phase 5 — Validate deployment (CD has deployed by now)"
      block:
        - name: Wait for CD rollout to complete
          ansible.builtin.wait_for:
            port: "{{ demo_app_port }}"
            timeout: 120
            delay: 30

        - name: Post-deploy health check
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/health"
            method: GET
            status_code: [200]
          register: health_check
          retries: 10
          delay: 10

        - name: Verify application reports correct library version
          ansible.builtin.uri:
            url: "http://localhost:{{ demo_app_port }}/version"
            method: GET
            status_code: [200]
          register: version_check
          failed_when: false

        - name: Build GitOps remediation report
          ansible.builtin.set_fact:
            gitops_report:
              host: "{{ inventory_hostname }}"
              app_name: "{{ app_name }}"
              cve_id: "{{ cve_id }}"
              remediation_type: "gitops_pr_rebuild"
              merge_request: "{{ hostvars['localhost']['merge_request_url'] | default('N/A') }}"
              library_fixed: "{{ affected_library }}=={{ fixed_version }}"
              service_healthy: "{{ health_check.status == 200 }}"
              timestamp: "{{ ansible_date_time.iso8601 }}"

        - name: Display GitOps remediation summary
          ansible.builtin.debug:
            msg: |
              === GITOPS REMEDIATION REPORT ===
              Host: {{ gitops_report.host }}
              App: {{ gitops_report.app_name }}
              CVE: {{ gitops_report.cve_id }}
              Type: {{ gitops_report.remediation_type }}
              MR: {{ gitops_report.merge_request }}
              Library: {{ gitops_report.library_fixed }}
              Healthy: {{ gitops_report.service_healthy }}
              ==================================
              WORKFLOW SUMMARY:
              1. Lightwell published fix → internal PyPI
              2. AAP opened PR updating dependency pin
              3. CI built + tested automatically
              4. Merge triggered CD deployment
              5. AAP validated service health post-deploy
              ==================================
              KEY: No host-level patching occurred.
              The fix was BUILT INTO the application via CI/CD.
              ==================================
