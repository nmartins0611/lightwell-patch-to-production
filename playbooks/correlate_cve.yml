---
# Demo 1, Phase 2: Query RHTPA for CVE Correlation
#
# Given a CVE ID and affected package, queries RHTPA to identify which
# stored SBOMs contain the vulnerable component. Maps results back to
# AAP inventory and produces a prioritized exposure report.
#
# Triggered by: EDA workflow (after sbom_scan_upload or from stored SBOMs)

- name: "CVE Correlation — Query RHTPA and Map to Inventory"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_cve_id }}"
    affected_package: "{{ demo_cve_package }}"
    cvss_vector: "{{ demo_cvss_vector }}"
    cwe_ids: "{{ demo_cwe_ids }}"

  tasks:
    - name: Acquire OIDC token from Keycloak
      ansible.builtin.uri:
        url: "{{ rhtpa_keycloak_url }}/realms/{{ rhtpa_keycloak_realm }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ rhtpa_oidc_client_id }}"
          client_secret: "{{ rhtpa_oidc_client_secret }}"
          grant_type: "client_credentials"
          scope: "openid read:document"
        status_code: [200]
        validate_certs: false
      register: token_response

    - name: Query RHTPA for CVE vulnerability record
      ansible.builtin.uri:
        url: "{{ rhtpa_api_endpoint }}/api/v2/vulnerability?q={{ cve_id }}"
        method: GET
        headers:
          Accept: "application/json"
          Authorization: "Bearer {{ token_response.json.access_token }}"
        status_code: [200]
        validate_certs: false
      register: rhtpa_vuln_results

    - name: Confirm CVE exists in RHTPA
      ansible.builtin.assert:
        that:
          - rhtpa_vuln_results.json.total | int > 0
        fail_msg: "CVE {{ cve_id }} not found in RHTPA — upload the advisory first"
        success_msg: "CVE {{ cve_id }} found in RHTPA ({{ rhtpa_vuln_results.json['items'][0].advisories | length }} advisory)"

    - name: Query RHTPA for SBOMs containing the vulnerable package
      ansible.builtin.uri:
        url: "{{ rhtpa_api_endpoint }}/api/v2/sbom/by-package?purl=pkg%3Apypi%2Fcryptography%4036.0.1"
        method: GET
        headers:
          Accept: "application/json"
          Authorization: "Bearer {{ token_response.json.access_token }}"
        status_code: [200]
        validate_certs: false
      register: rhtpa_sbom_results

    - name: Extract SBOM source names from RHTPA results
      ansible.builtin.set_fact:
        sbom_source_names: "{{ rhtpa_sbom_results.json['items'] | map(attribute='name') | list }}"

    - name: Build reverse lookup of ansible_host to inventory_hostname
      ansible.builtin.set_fact:
        host_lookup: >-
          {{
            dict(
              groups['targets']
              | map('extract', hostvars, 'ansible_host')
              | zip(groups['targets'])
            )
          }}

    - name: Map RHTPA SBOM names to inventory hosts
      ansible.builtin.set_fact:
        affected_hosts: >-
          {{
            sbom_source_names
            | select('in', host_lookup.keys())
            | map('extract', host_lookup)
            | list
          }}

    - name: Display RHTPA correlation results
      ansible.builtin.debug:
        msg: >-
          RHTPA returned {{ rhtpa_sbom_results.json.total }} SBOMs containing {{ affected_package }}.
          Mapped to inventory: {{ affected_hosts | join(', ') }}

    - name: Enrich with inventory context
      ansible.builtin.set_fact:
        exposure_report:
          cve_id: "{{ cve_id }}"
          cvss_vector: "{{ cvss_vector }}"
          cvss_base_score: 10.0
          cwe_ids: "{{ cwe_ids }}"
          affected_package: "{{ affected_package }}"
          affected_hosts: "{{ affected_hosts }}"
          affected_count: "{{ affected_hosts | length }}"
          sbom_sources: "{{ sbom_source_names }}"
          rhtpa_advisory: "{{ rhtpa_vuln_results.json['items'][0].advisories[0].document_id | default('N/A') }}"
          environment_exposure:
            production_hosts: "{{ affected_hosts | select('in', groups.get('production', [])) | list }}"
            internet_facing: true
          remediation_layer: "OS"
          fix_available: false
          recommended_action: "Apply compensating controls (CME mitigation)"
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Ensure report output directory exists
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0750"

    - name: Write exposure report
      ansible.builtin.copy:
        content: "{{ exposure_report | to_nice_json }}"
        dest: "{{ report_output_dir }}/exposure-report-{{ cve_id }}.json"
        mode: "0644"

    - name: Display exposure summary
      ansible.builtin.debug:
        msg: |
          === CVE EXPOSURE REPORT ===
          CVE: {{ exposure_report.cve_id }}
          CVSS: {{ exposure_report.cvss_base_score }} ({{ exposure_report.cvss_vector }})
          Affected hosts: {{ exposure_report.affected_count }}
          Internet-facing: {{ exposure_report.environment_exposure.internet_facing }}
          Fix available: {{ exposure_report.fix_available }}
          Recommended action: {{ exposure_report.recommended_action }}
          ===========================

    - name: Create dynamic inventory for affected hosts on Controller
      ansible.controller.inventory:
        name: "affected_hosts-{{ cve_id }}"
        organization: "Default"
        description: >-
          Hosts affected by {{ cve_id }} ({{ affected_package }}).
          Auto-generated by CVE correlation on {{ ansible_date_time.iso8601 }}.
          CVSS {{ exposure_report.cvss_base_score }} — {{ affected_hosts | length }} hosts exposed.
        controller_host: "{{ vault_controller_host }}"
        controller_oauthtoken: "{{ vault_controller_token }}"
        validate_certs: false

    - name: Add affected hosts to CVE inventory
      ansible.controller.host:
        name: "{{ item }}"
        inventory: "affected_hosts-{{ cve_id }}"
        variables:
          ansible_host: "{{ hostvars[item]['ansible_host'] }}"
          cve_id: "{{ cve_id }}"
          affected_package: "{{ affected_package }}"
          cvss_base_score: "{{ exposure_report.cvss_base_score }}"
          node_role: "{{ hostvars[item]['node_role'] | default('unknown') }}"
          environment_type: "{{ hostvars[item]['environment_type'] | default('unknown') }}"
        controller_host: "{{ vault_controller_host }}"
        controller_oauthtoken: "{{ vault_controller_token }}"
        validate_certs: false
      loop: "{{ affected_hosts }}"

    - name: Display Controller inventory created
      ansible.builtin.debug:
        msg: >-
          Created inventory 'affected_hosts-{{ cve_id }}' on Controller
          with {{ affected_hosts | length }} hosts: {{ affected_hosts | join(', ') }}

- name: "Publish Exposure Report to Report Server"
  hosts: builders
  become: true
  gather_facts: false
  vars_files:
    - ../vars/vault.yml
  vars:
    cve_id: "{{ demo_cve_id }}"

  tasks:
    - name: Ensure report web directory exists
      ansible.builtin.file:
        path: "{{ report_web_dir }}"
        state: directory
        mode: "0755"

    - name: Publish exposure report
      ansible.builtin.copy:
        content: "{{ hostvars['localhost']['exposure_report'] | to_nice_json }}"
        dest: "{{ report_web_dir }}/exposure-report-{{ cve_id }}.json"
        mode: "0644"

    - name: Report published
      ansible.builtin.debug:
        msg: "Report available at {{ report_server_url }}/exposure-report-{{ cve_id }}.json"
