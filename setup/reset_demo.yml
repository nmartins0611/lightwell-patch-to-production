---
# Reset Demo — Return everything to pre-demo state
#
# Makes the demo fully repeatable by reverting all changes made
# during Demos 1-4. Run this between demo sessions.
#
# Usage:
#   ansible-playbook setup/reset_demo.yml -i inventory/hosts.yml --ask-vault-pass
#
# Optional tags to reset only specific demos:
#   --tags os_package     Reset Demo 1-3 (OS-level CVE)
#   --tags app_dependency Reset Demo 4 (app dependency)
#   --tags reports        Clear reports only
#   --tags gitea          Reset Gitea repo only

- name: "Reset Demo — OS Package State (Demo 1-3)"
  hosts: targets
  become: true
  gather_facts: false
  tags: [os_package, all_demos]
  vars:
    cve_id: "{{ demo_cve_id }}"

  tasks:
    - name: Downgrade python3-cryptography to vulnerable version
      ansible.builtin.dnf:
        name: "python3-cryptography-{{ demo_cve_vulnerable_version }}"
        state: present
        allow_downgrade: true
      failed_when: false

    - name: Remove any CME compensating controls
      block:
        - name: Remove firewall mitigation rule
          ansible.posix.firewalld:
            rich_rule: >-
              rule family="ipv4"
              service name="https"
              source NOT address="10.0.0.0/8"
              drop
            permanent: true
            immediate: true
            state: disabled
          failed_when: false

        - name: Remove audit detection rules
          ansible.builtin.file:
            path: "/etc/audit/rules.d/cme-{{ cve_id }}.rules"
            state: absent

        - name: Remove rsyslog forwarding rules
          ansible.builtin.file:
            path: "/etc/rsyslog.d/50-cme-{{ cve_id }}.conf"
            state: absent

        - name: Remove mitigation state file
          ansible.builtin.file:
            path: "/var/lib/cme/{{ cve_id }}-mitigation.json"
            state: absent

        - name: Restart auditd
          ansible.builtin.command:
            cmd: service auditd restart
          changed_when: true
          failed_when: false

        - name: Restart rsyslog
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          failed_when: false

    - name: Clear SBOM artifacts from targets
      ansible.builtin.file:
        path: "{{ sbom_output_dir }}"
        state: absent

    - name: Recreate SBOM output directory
      ansible.builtin.file:
        path: "{{ sbom_output_dir }}"
        state: directory
        mode: "0750"

    - name: Confirm OS package reset
      ansible.builtin.command:
        cmd: rpm -q python3-cryptography
      register: pkg_version
      changed_when: false
      failed_when: false

    - name: Display OS reset status
      ansible.builtin.debug:
        msg: "OS package reset: {{ pkg_version.stdout | default('package not found') }}"

- name: "Reset Demo — App Dependency State (Demo 4)"
  hosts: targets
  become: true
  gather_facts: false
  tags: [app_dependency, all_demos]
  vars:
    app_name: "{{ demo_app_name }}"

  tasks:
    - name: Stop and remove config-service container
      containers.podman.podman_container:
        name: "{{ app_name }}"
        state: absent
      failed_when: false

    - name: Remove config-service images
      ansible.builtin.shell:
        cmd: |
          podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' | \
            grep -i "{{ app_name }}\|config-service" | \
            xargs -r podman rmi -f
      changed_when: true
      failed_when: false

    - name: Clean up image tars
      ansible.builtin.shell:
        cmd: "rm -f /tmp/{{ app_name }}-*.tar"
      changed_when: true
      failed_when: false

    - name: Display app reset status
      ansible.builtin.debug:
        msg: "App container removed from {{ inventory_hostname }}"

- name: "Reset Demo — Builder State"
  hosts: builders
  become: true
  gather_facts: false
  tags: [os_package, app_dependency, all_demos]
  vars:
    app_name: "{{ demo_app_name }}"
    cve_id: "{{ demo_cve_id }}"

  tasks:
    - name: Remove container test images (Demo 3)
      ansible.builtin.shell:
        cmd: |
          podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' | \
            grep -i "patch-test\|patch_test" | \
            xargs -r podman rmi -f
      changed_when: true
      failed_when: false

    - name: Remove app rebuild images (Demo 4)
      ansible.builtin.shell:
        cmd: |
          podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' | \
            grep -i "{{ app_name }}\|config-service" | \
            xargs -r podman rmi -f
      changed_when: true
      failed_when: false

    - name: Clean up build workspaces
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/app-container-rebuild
        - /tmp/app-gitops
        - /tmp/app-rebuild
        - /tmp/Containerfile.patch-test
        - /tmp/Containerfile.patch-apply
        - /tmp/config-service-seed

    - name: Clean up image tars
      ansible.builtin.shell:
        cmd: "rm -f /tmp/{{ app_name }}-*.tar"
      changed_when: true
      failed_when: false

    - name: Update Grype DB for next run
      ansible.builtin.command:
        cmd: grype db update
      changed_when: true
      failed_when: false

- name: "Reset Demo — Gitea Repository"
  hosts: builders
  gather_facts: false
  tags: [gitea, app_dependency, all_demos]
  vars:
    gitea_url: "http://localhost:{{ gitea_port | default(3000) }}"
    gitea_admin_user: "demo-admin"
    gitea_admin_password: "{{ vault_gitea_admin_password | default('Demo2026!') }}"
    app_name: "{{ demo_app_name }}"

  tasks:
    - name: Close any open PRs
      block:
        - name: List open pull requests
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/pulls?state=open"
            method: GET
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            status_code: [200]
          register: open_prs

        - name: Close each open PR
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/pulls/{{ item.number }}"
            method: PATCH
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            body_format: json
            body:
              state: "closed"
            status_code: [200]
          loop: "{{ open_prs.json }}"
          loop_control:
            label: "PR #{{ item.number }}"
          when: open_prs.json | length > 0

    - name: Delete security fix branches
      block:
        - name: List branches
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/branches"
            method: GET
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            status_code: [200]
          register: branches

        - name: Delete security/* branches
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/branches/{{ item.name }}"
            method: DELETE
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            status_code: [204, 404]
          loop: "{{ branches.json | selectattr('name', 'match', 'security/.*') | list }}"
          loop_control:
            label: "{{ item.name }}"
          when: branches.json | selectattr('name', 'match', 'security/.*') | list | length > 0

    - name: Reset requirements.txt to vulnerable version
      block:
        - name: Read current requirements.txt
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/contents/requirements.txt"
            method: GET
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            status_code: [200]
          register: req_file

        - name: Build vulnerable content
          ansible.builtin.set_fact:
            vulnerable_deps: |
              pyyaml==6.0.1
              flask==3.1.0
              gunicorn==23.0.0

        - name: Revert to vulnerable dependency version
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ app_name }}/contents/requirements.txt"
            method: PUT
            user: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            body_format: json
            body:
              message: "reset: revert pyyaml to 6.0.1 (vulnerable) for demo reset"
              content: "{{ vulnerable_deps | b64encode }}"
              sha: "{{ req_file.json.sha }}"
              branch: "main"
              committer:
                name: "Demo Reset"
                email: "demo@nostromo.io"
            status_code: [200]
          when: "'6.0.1' not in (req_file.json.content | b64decode)"

    - name: Display Gitea reset status
      ansible.builtin.debug:
        msg: "Gitea repo reset: PRs closed, fix branches deleted, requirements.txt reverted to pyyaml==6.0.1"

- name: "Reset Demo — Reports and Artifacts"
  hosts: builders
  become: true
  gather_facts: false
  tags: [reports, all_demos]

  tasks:
    - name: Clear report files from web server
      ansible.builtin.shell:
        cmd: "rm -f {{ report_web_dir }}/*.json"
      changed_when: true
      failed_when: false

    - name: Clear local report directory
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: absent

    - name: Recreate report directory
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0750"

- name: "Reset Demo — Local Controller Artifacts"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [reports, all_demos]

  tasks:
    - name: Clear local SBOM artifacts
      ansible.builtin.file:
        path: "{{ sbom_output_dir }}"
        state: absent

    - name: Recreate local SBOM directory
      ansible.builtin.file:
        path: "{{ sbom_output_dir }}"
        state: directory
        mode: "0750"

    - name: Clear local report directory
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: absent

    - name: Recreate local report directory
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0750"

    - name: Display reset complete
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════╗
          ║         DEMO RESET COMPLETE           ║
          ╠═══════════════════════════════════════╣
          ║ OS package: reverted to vulnerable    ║
          ║ CME controls: removed                 ║
          ║ App containers: removed from targets  ║
          ║ Gitea repo: reverted to pyyaml==6.0.1 ║
          ║ PRs: closed, fix branches deleted     ║
          ║ Build images: cleaned up              ║
          ║ Reports: cleared                      ║
          ║ SBOMs: cleared                        ║
          ╚═══════════════════════════════════════╝

          Ready to run demos again.
          Start with: ansible-playbook playbooks/sbom_scan_upload.yml
