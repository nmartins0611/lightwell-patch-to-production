---
# Deploy CME MCP Server on Node 2
#
# Runs the CME MCP server as a single container (SQLite backend).
# Seeds the taxonomy database on startup, then serves on port 8000.

- name: "Deploy CME MCP Server"
  hosts: builders
  become: true
  gather_facts: true
  vars:
    cme_repo_url: "https://github.com/nmartins0611/cme.git"
    cme_build_dir: "/opt/cme"

  tasks:
    - name: Install git if missing
      ansible.builtin.dnf:
        name: git
        state: present

    - name: Clone CME repository
      ansible.builtin.git:
        repo: "{{ cme_repo_url }}"
        dest: "{{ cme_build_dir }}"
        version: main
        force: true

    - name: Stop existing CME containers
      containers.podman.podman_container:
        name: "{{ item }}"
        state: absent
      loop:
        - cme-server
        - cme-seed
        - cme-postgres

    - name: Build CME image
      containers.podman.podman_image:
        name: localhost/cme-server
        path: "{{ cme_build_dir }}"
        build:
          file: Dockerfile
        force: true

    - name: Run CME MCP server (seed + serve)
      containers.podman.podman_container:
        name: cme-server
        image: localhost/cme-server
        state: started
        restart_policy: always
        publish:
          - "8000:8000"
        env:
          CME_DB_BACKEND: sqlite
          CME_TRANSPORT: streamable-http
          CME_HTTP_HOST: "0.0.0.0"
          CME_HTTP_PORT: "8000"
        command: "sh -c 'uv run python -m src.seed && uv run python -m src.server'"

    - name: Open firewall port 8000
      ansible.posix.firewalld:
        port: 8000/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Wait for CME server to respond
      ansible.builtin.uri:
        url: "http://localhost:8000/mcp"
        method: POST
        body_format: json
        headers:
          Accept: "application/json, text/event-stream"
        body:
          jsonrpc: "2.0"
          id: 0
          method: initialize
          params:
            protocolVersion: "2025-03-26"
            capabilities: {}
            clientInfo:
              name: health-check
              version: "1.0"
        status_code: [200]
        timeout: 10
      register: mcp_health
      retries: 12
      delay: 5
      until: mcp_health.status == 200

    - name: CME MCP server deployed
      ansible.builtin.debug:
        msg: "CME MCP server running at http://{{ ansible_host }}:8000/mcp — 118 controls, SQLite backend"
